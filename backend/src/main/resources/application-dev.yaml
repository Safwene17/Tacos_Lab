spring:
  jpa:
    show-sql: true

logging:
  level:
    com.example.backend: DEBUG
    org.springframework.security: DEBUG

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS}
      issuer: ${JWT_ISSUER}
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME}
      path: ${REFRESH_COOKIE_PATH}
      http-only: true
      secure: ${REFRESH_COOKIE_SECURE}
      same-site: ${REFRESH_COOKIE_SAME_SITE}

  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
    allow-credentials: true

  admin:
    email: ${ADMIN_EMAIL}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    folder: ${CLOUDINARY_FOLDER}
