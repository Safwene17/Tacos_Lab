<aside
  class="fixed left-0 top-0 z-50 flex h-screen flex-col border-r border-gray-200 bg-white px-5 text-gray-900 transition-all duration-300 ease-in-out dark:border-gray-800 dark:bg-gray-900"
  [ngClass]="{
    'w-72.5': sidebar.isDesktopExpanded() && sidebar.isDesktopView(),
    'w-22.5': !sidebar.isDesktopExpanded() && sidebar.isDesktopView(),
    'w-64': sidebar.isMobileOpen() && !sidebar.isDesktopView(),
    'translate-x-0': sidebar.isMobileOpen() || sidebar.isDesktopView(),
    '-translate-x-full': !sidebar.isMobileOpen() && !sidebar.isDesktopView()
  }"
  (mouseenter)="sidebar.setHovered(true)"
  (mouseleave)="sidebar.setHovered(false)"
>
  <div
    class="flex h-18 items-center border-b border-gray-100 dark:border-gray-800"
    [ngClass]="{
      'justify-start': sidebar.isDesktopExpanded() || sidebar.isMobileOpen(),
      'justify-center': !sidebar.isDesktopExpanded() && !sidebar.isMobileOpen()
    }"
  >
    <a routerLink="/admin/dashboard" class="flex items-center gap-3">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-gray-900 text-sm font-bold text-white dark:bg-white dark:text-gray-900"
      >
        TL
      </div>

      @if (sidebar.isDesktopExpanded() || sidebar.isMobileOpen()) {
        <div class="leading-tight">
          <p class="text-base font-semibold text-gray-900 dark:text-white">
            Tacos Lab
          </p>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            Admin Panel
          </p>
        </div>
      }
    </a>
  </div>

  <div class="flex flex-1 flex-col overflow-y-auto py-6">
    @if (sidebar.isDesktopExpanded() || sidebar.isMobileOpen()) {
      <p class="mb-4 px-3 text-xs font-medium uppercase tracking-[0.14em] text-gray-400">
        Menu
      </p>
    }

    <nav class="space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-admin-brand-50 text-admin-brand-500 dark:bg-admin-brand-500/[0.12] dark:text-admin-brand-400"
          [routerLinkActiveOptions]="{ exact: item.path === '/admin/dashboard' }"
          class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-white"
          [ngClass]="{
            'justify-center': !sidebar.isDesktopExpanded() && !sidebar.isMobileOpen(),
            'justify-start': sidebar.isDesktopExpanded() || sidebar.isMobileOpen()
          }"
          (click)="sidebar.closeMobileSidebar()"
        >
          <svg
            class="h-5 w-5 shrink-0"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path [attr.d]="iconPath(item.icon)" />
          </svg>

          @if (sidebar.isDesktopExpanded() || sidebar.isMobileOpen()) {
            <span>{{ item.label }}</span>
          }
        </a>
      }
    </nav>
  </div>

</aside>
