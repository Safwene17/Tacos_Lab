<div class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <button
        type="button"
        class="mb-3 inline-flex items-center text-sm font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white"
        (click)="cancel()"
      >
        ← Back to categories
      </button>

      <h1 class="text-title-sm font-semibold text-gray-800 dark:text-white/90">
        {{ categoryId() ? 'Edit Category' : 'Add Category' }}
      </h1>

      <p class="mt-1 text-theme-sm text-gray-500 dark:text-gray-400">
        Configure category names, visibility, and display order.
      </p>
    </div>
  </div>

  @if (error()) {
    <div class="rounded-2xl border border-error-500/20 bg-error-50 p-5 dark:border-error-500/30 dark:bg-error-500/10">
      <p class="text-theme-sm font-medium text-error-700 dark:text-error-500">
        {{ error() }}
      </p>

      <button
        type="button"
        class="mt-4 rounded-lg bg-error-600 px-4 py-2 text-theme-sm font-medium text-white hover:bg-error-700"
        (click)="loadCategory()"
      >
        Retry
      </button>
    </div>
  }

  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-gray-900 sm:p-6">
    @if (loading()) {
      <div class="space-y-5 animate-pulse">
        <div class="h-6 w-48 rounded bg-gray-200 dark:bg-gray-800"></div>
        <div class="grid grid-cols-1 gap-5">
          @for (_ of [1, 2, 3, 4]; track _) {
            <div class="h-11 rounded-lg bg-gray-200 dark:bg-gray-800"></div>
          }
        </div>
      </div>
    } @else {
      <form class="space-y-6" [formGroup]="form" (ngSubmit)="submit()">
        <div>
          <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
            Category Details
          </h3>

          <p class="mt-1 text-theme-sm text-gray-500 dark:text-gray-400">
            Name, display order, and visibility settings.
          </p>
        </div>

        <div class="grid grid-cols-1 gap-5">
          <label class="block">
            <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300">Name EN</span>
            <input
              type="text"
              formControlName="nameEn"
              class="mt-1 h-11 w-full rounded-lg border border-gray-300 bg-white px-4 text-theme-sm text-gray-800 outline-none transition focus:border-admin-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            />
            @if (fieldError('nameEn')) {
              <p class="mt-1 text-theme-xs text-error-600 dark:text-error-500">
                {{ fieldError('nameEn') }}
              </p>
            }
          </label>

          <label class="block">
            <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300">Name RO</span>
            <input
              type="text"
              formControlName="nameRo"
              class="mt-1 h-11 w-full rounded-lg border border-gray-300 bg-white px-4 text-theme-sm text-gray-800 outline-none transition focus:border-admin-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            />
            @if (fieldError('nameRo')) {
              <p class="mt-1 text-theme-xs text-error-600 dark:text-error-500">
                {{ fieldError('nameRo') }}
              </p>
            }
          </label>

          <label class="block">
            <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300">Display Order</span>
            <input
              type="number"
              formControlName="displayOrder"
              min="0"
              class="mt-1 h-11 w-full rounded-lg border border-gray-300 bg-white px-4 text-theme-sm text-gray-800 outline-none transition focus:border-admin-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
            />
            @if (fieldError('displayOrder')) {
              <p class="mt-1 text-theme-xs text-error-600 dark:text-error-500">
                {{ fieldError('displayOrder') }}
              </p>
            }
          </label>
        </div>

        <div class="flex flex-wrap gap-6 border-t border-gray-100 pt-6 dark:border-gray-800">
          <label class="flex items-center gap-3">
            <input type="checkbox" formControlName="markAsNew" class="h-4 w-4 rounded border-gray-300" />
            <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300">Mark as New</span>
          </label>

          <label class="flex items-center gap-3">
            <input type="checkbox" formControlName="active" class="h-4 w-4 rounded border-gray-300" />
            <span class="text-theme-sm font-medium text-gray-700 dark:text-gray-300">Active</span>
          </label>
        </div>

        <div class="flex flex-col-reverse gap-3 border-t border-gray-100 pt-6 dark:border-gray-800 sm:flex-row sm:justify-end">
          <button
            type="button"
            class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-theme-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-800"
            (click)="cancel()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="inline-flex items-center justify-center rounded-lg bg-admin-brand-500 px-5 py-2.5 text-theme-sm font-medium text-white shadow-theme-xs hover:bg-admin-brand-600 disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="saving()"
          >
            {{ saving() ? 'Saving...' : categoryId() ? 'Save Changes' : 'Create Category' }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
