<section id="contact" class="relative overflow-hidden bg-brand-black px-6 py-24 sm:px-12 lg:px-24">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_30%,rgba(255,210,48,0.10),transparent_35%)]"></div>

  <div class="relative z-10 mx-auto max-w-4xl">
    <app-section-title
      title="Ready to order?"
      subtitle="Find Le Tacos in Timișoara and order directly through Wolt."
    />

    <div
      appScrollReveal
      class="rounded-[2rem] border border-brand-gold/25 bg-brand-softblack/85 p-8 text-center shadow-[0_28px_95px_rgba(0,0,0,0.48)] backdrop-blur-xl sm:p-12"
    >
      <div class="grid gap-5 text-left sm:grid-cols-3">
        <div
          class="rounded-2xl border border-white/10 bg-black/35 p-5 shadow-[0_12px_35px_rgba(0,0,0,0.24)] transition duration-300 hover:-translate-y-0.5 hover:border-brand-gold/30 hover:bg-brand-gold/[0.045]"
        >
          <p class="text-3xl">📍</p>
          <p class="mt-3 font-black text-brand-yellow">Location</p>
          <p class="mt-2 text-sm text-white/55">Timișoara, Romania</p>
        </div>

        <div
          class="rounded-2xl border border-white/10 bg-black/35 p-5 shadow-[0_12px_35px_rgba(0,0,0,0.24)] transition duration-300 hover:-translate-y-0.5 hover:border-brand-gold/30 hover:bg-brand-gold/[0.045]"
        >
          <p class="text-3xl">🛵</p>
          <p class="mt-3 font-black text-brand-yellow">Order via</p>
          <p class="mt-2 text-sm text-white/55">Wolt delivery</p>
        </div>

        <div
          class="rounded-2xl border border-white/10 bg-black/35 p-5 shadow-[0_12px_35px_rgba(0,0,0,0.24)] transition duration-300 hover:-translate-y-0.5 hover:border-brand-gold/30 hover:bg-brand-gold/[0.045]"
        >
          <p class="text-3xl">🕐</p>
          <p class="mt-3 font-black text-brand-yellow">Availability</p>
          <p class="mt-2 text-sm text-white/55">Check live on Wolt</p>
        </div>
      </div>

      <a
        [href]="woltUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="mx-auto mt-10 inline-flex w-full items-center justify-center rounded-full bg-brand-gold px-8 py-5 text-sm font-black uppercase tracking-[0.16em] text-brand-black shadow-[0_16px_50px_rgba(255,210,48,0.24)] transition duration-300 hover:-translate-y-0.5 hover:bg-brand-yellow hover:shadow-[0_20px_65px_rgba(255,210,48,0.34)] sm:w-auto"
      >
        Order on Wolt →
      </a>
    </div>
  </div>
</section>
