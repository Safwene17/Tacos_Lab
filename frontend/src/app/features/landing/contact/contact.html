<section id="contact" class="relative overflow-hidden bg-brand-black px-6 py-24 sm:px-12 lg:px-24">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_30%,rgba(255,210,48,0.10),transparent_35%)]"></div>

  <div class="relative z-10 mx-auto max-w-4xl">
    <app-section-title
      [title]="'Contact Us'"
      [subtitle]="'Get In Touch'"
    />

    <div
      appScrollReveal
      class="rounded-[2rem] border border-brand-gold/25 bg-brand-softblack/85 p-8 text-center shadow-[0_28px_95px_rgba(0,0,0,0.48)] backdrop-blur-xl sm:p-12"
    >
      <div class="grid gap-5 text-left sm:grid-cols-2">
        <div class="rounded-2xl border border-white/10 bg-black/35 p-5 shadow-[0_12px_35px_rgba(0,0,0,0.24)] transition duration-300 hover:-translate-y-0.5 hover:border-brand-gold/30 hover:bg-brand-gold/[0.045]">
          <div class="text-brand-yellow">
            <app-icon name="location" size="lg" />
          </div>
          <p class="mt-3 font-black text-brand-yellow">Location</p>
          <p class="mt-2 text-sm text-white/72">{{ contactInfo.address }}</p>
        </div>

        <div class="rounded-2xl border border-white/10 bg-black/35 p-5 shadow-[0_12px_35px_rgba(0,0,0,0.24)] transition duration-300 hover:-translate-y-0.5 hover:border-brand-gold/30 hover:bg-brand-gold/[0.045]">
          <div class="text-brand-yellow">
            <app-icon name="star" size="lg" />
          </div>
          <p class="mt-3 font-black text-brand-yellow">Get in Touch</p>
          <p class="mt-2 text-sm text-white/72">
            <a href="tel:+40256123456" class="hover:text-brand-gold transition">{{ contactInfo.phone }}</a>
          </p>
          <p class="mt-1 text-sm text-white/72">
            <a href="mailto:hello@tacoslab.ro" class="hover:text-brand-gold transition">{{ contactInfo.email }}</a>
          </p>
        </div>

        <div class="rounded-2xl border border-white/10 bg-black/35 p-5 shadow-[0_12px_35px_rgba(0,0,0,0.24)] transition duration-300 hover:-translate-y-0.5 hover:border-brand-gold/30 hover:bg-brand-gold/[0.045] sm:col-span-2">
          <div class="text-brand-yellow">
            <app-icon name="clock" size="lg" />
          </div>
          <p class="mt-3 font-black text-brand-yellow">Hours of Operation</p>
          <div class="mt-2 space-y-1 text-sm text-white/72">
            <p><span class="font-semibold text-white">Monday - Friday:</span> {{ contactInfo.hours.weekdays }}</p>
            <p><span class="font-semibold text-white">Saturday - Sunday:</span> {{ contactInfo.hours.weekends }}</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
