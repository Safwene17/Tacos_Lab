<section id="menu" class="relative overflow-hidden bg-brand-softblack px-6 py-24 sm:px-12 lg:px-24">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(255,210,48,0.08),transparent_32%)]"></div>

  <div class="relative z-10 mx-auto max-w-7xl">
    <app-section-title
      title="Our Menu"
      subtitle="Choose your size, pick your favorite filling, and let the melted cheese do the rest."
    />

    <div
      appScrollReveal
      class="mb-12 flex flex-wrap justify-center gap-3"
    >
      @for (tab of tabs; track tab.value) {
        <button
          type="button"
          class="rounded-full border px-5 py-3 text-sm font-black uppercase tracking-[0.14em] shadow-[0_12px_35px_rgba(0,0,0,0.22)] transition duration-300 hover:-translate-y-0.5"
          [class.border-brand-gold]="selectedCategory() === tab.value"
          [class.bg-brand-gold]="selectedCategory() === tab.value"
          [class.text-brand-black]="selectedCategory() === tab.value"
          [class.shadow-[0_14px_45px_rgba(255,210,48,0.22)]]="selectedCategory() === tab.value"
          [class.border-brand-gold/25]="selectedCategory() !== tab.value"
          [class.bg-black/35]="selectedCategory() !== tab.value"
          [class.text-white/62]="selectedCategory() !== tab.value"
          [class.backdrop-blur-md]="selectedCategory() !== tab.value"
          [class.hover:border-brand-gold/60]="selectedCategory() !== tab.value"
          [class.hover:text-brand-yellow]="selectedCategory() !== tab.value"
          [class.hover:bg-brand-gold/10]="selectedCategory() !== tab.value"
          (click)="selectCategory(tab.value)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    @if (filteredItems().length > 0) {
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        @for (item of filteredItems(); track item.name; let index = $index) {
          <div
            appScrollReveal
            [appScrollRevealDelay]="revealDelay(index)"
          >
            <app-menu-card [item]="item" />
          </div>
        }
      </div>
    } @else {
      <div
        appScrollReveal
        class="mx-auto max-w-xl rounded-2xl border border-brand-gold/25 bg-black/35 p-8 text-center shadow-[0_24px_70px_rgba(0,0,0,0.38)] backdrop-blur-md"
      >
        <p class="font-display text-4xl text-brand-yellow">
          Coming soon
        </p>
        <p class="mt-3 text-white/60">
          This category will be available soon at Le Tacos.
        </p>
      </div>
    }
  </div>
</section>
