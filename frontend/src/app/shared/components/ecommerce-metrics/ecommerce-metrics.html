<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6">
  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] md:p-6">
    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-800">
      <svg class="size-6 text-gray-800 dark:text-white/90" viewBox="0 0 24 24" fill="none">
        <path
          d="M4 19V5M4 19H20M8 16L11 12L14 14L19 7"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="mt-5 flex items-end justify-between">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">Revenue</span>
        <h4 class="mt-2 font-bold text-gray-800 text-title-sm dark:text-white/90">
          {{ money(revenue()) }}
        </h4>
      </div>

      <span class="inline-flex items-center gap-1 rounded-full bg-success-50 px-2.5 py-0.5 text-theme-xs font-medium text-success-600 dark:bg-success-500/15 dark:text-success-500">
        Live
      </span>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] md:p-6">
    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-800">
      <svg class="size-6 text-gray-800 dark:text-white/90" viewBox="0 0 24 24" fill="none">
        <path
          d="M7 7H17M7 12H17M7 17H13"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <div class="mt-5 flex items-end justify-between">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">Expenses</span>
        <h4 class="mt-2 font-bold text-gray-800 text-title-sm dark:text-white/90">
          {{ money(expenses()) }}
        </h4>
      </div>

      <span class="inline-flex items-center gap-1 rounded-full bg-error-50 px-2.5 py-0.5 text-theme-xs font-medium text-error-600 dark:bg-error-500/15 dark:text-error-500">
        Live
      </span>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] md:p-6">
    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-800">
      <svg class="size-6 text-gray-800 dark:text-white/90" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 3V21M17 7.5C16.1 6.6 14.6 6 12.8 6C10.2 6 8.5 7.2 8.5 9C8.5 12.5 17.5 10.5 17.5 15C17.5 16.8 15.8 18 13.2 18C11.2 18 9.4 17.4 8 16.2"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <div class="mt-5 flex items-end justify-between">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">Net Profit</span>
        <h4 class="mt-2 font-bold text-gray-800 text-title-sm dark:text-white/90">
          {{ money(netProfit()) }}
        </h4>
      </div>

      <span
        class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-theme-xs font-medium"
        [class.bg-success-50]="netProfit() >= 0"
        [class.text-success-600]="netProfit() >= 0"
        [class.dark:bg-success-500/15]="netProfit() >= 0"
        [class.dark:text-success-500]="netProfit() >= 0"
        [class.bg-error-50]="netProfit() < 0"
        [class.text-error-600]="netProfit() < 0"
        [class.dark:bg-error-500/15]="netProfit() < 0"
        [class.dark:text-error-500]="netProfit() < 0"
      >
        {{ netProfit() >= 0 ? 'Profit' : 'Loss' }}
      </span>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] md:p-6">
    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-800">
      <svg class="size-6 text-gray-800 dark:text-white/90" viewBox="0 0 24 24" fill="none">
        <path
          d="M16 11C17.7 11 19 9.7 19 8C19 6.3 17.7 5 16 5M8 11C9.7 11 11 9.7 11 8C11 6.3 9.7 5 8 5C6.3 5 5 6.3 5 8C5 9.7 6.3 11 8 11ZM8 14C5.3 14 3 15.3 3 17V19H13V17C13 15.3 10.7 14 8 14ZM16 14C15.4 14 14.8 14.1 14.3 14.2C15.4 15 16 16 16 17V19H21V17C21 15.3 18.7 14 16 14Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="mt-5 flex items-end justify-between">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">Payroll</span>
        <h4 class="mt-2 font-bold text-gray-800 text-title-sm dark:text-white/90">
          {{ money(payrollTotal()) }}
        </h4>
      </div>

      <span class="inline-flex items-center gap-1 rounded-full bg-warning-50 px-2.5 py-0.5 text-theme-xs font-medium text-warning-600 dark:bg-warning-500/15 dark:text-warning-500">
        Salaries
      </span>
    </div>
  </div>
</div>
