<footer class="relative overflow-hidden border-t border-brand-gold/12 bg-black px-6 py-10 sm:px-12 lg:px-24">
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(255,210,48,0.08),transparent_34%)]"
  ></div>

  <div class="relative z-10 mx-auto max-w-7xl">
    <div
      class="flex flex-col items-center justify-between gap-10 text-center lg:flex-row lg:items-start lg:text-left"
    >
      <!-- Brand -->
      <div class="max-w-sm">
        <a
          href="#hero"
          class="inline-flex items-center justify-center gap-3 lg:justify-start"
          aria-label="Le Tacos home"
        >
          <span
            class="bg-gradient-to-r from-brand-gold via-brand-yellow to-brand-cream bg-clip-text font-display text-4xl leading-none text-transparent sm:text-5xl"
          >
            🌮 Le Tacos
          </span>
        </a>

        <p class="mt-4 text-sm font-semibold leading-6 text-white/55 sm:text-base">
          Original French Tacos • Timișoara 🇫🇷
        </p>

        <p class="mt-3 text-sm leading-6 text-white/38">
          Loaded French tacos with melted cheese, crispy fries, grilled meats,
          and bold sauces.
        </p>
      </div>

      <!-- Links -->
      <nav
        class="flex w-full flex-col items-center gap-4 sm:w-auto sm:flex-row sm:flex-wrap sm:justify-center lg:justify-end"
        aria-label="Footer navigation"
      >
        @for (link of links; track link.href) {
          <a
            [href]="link.href"
            class="w-full rounded-full border border-white/10 bg-white/[0.03] px-5 py-3 text-center text-xs font-black uppercase tracking-[0.18em] text-white/60 transition duration-300 hover:-translate-y-0.5 hover:border-brand-gold/30 hover:bg-brand-gold/10 hover:text-brand-yellow sm:w-auto"
          >
            {{ link.label }}
          </a>
        }
      </nav>
    </div>

    <!-- Bottom bar -->
    <div
      class="mt-10 flex flex-col items-center justify-center gap-4 border-t border-white/10 pt-6 text-center text-xs text-white/35 sm:text-sm"
    >
      <p>
        © 2026 Le Tacos. All rights reserved.
      </p>
    </div>
  </div>
</footer>
