@switch (name()) {
  @case ('taco') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 16.5C3.8 10.2 7.7 6 12 6s8.2 4.2 9 10.5H3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M6 16.5c.4-2.7 1.5-5 3.1-6.4M10.5 16.5c.2-3 1-5.3 2.2-6.9M15 16.5c-.1-2.7-.8-5-2-6.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M6.5 13.7h11M8.2 10.7h7.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M5 16.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  }

  @case ('cheese') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 10.5 13.5 5 20 9.2v9.3H4v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M4 10.5h16" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="9" cy="14.5" r="1.2" fill="currentColor"/>
      <circle cx="15.5" cy="15.5" r="1" fill="currentColor"/>
      <circle cx="12.5" cy="11.8" r=".8" fill="currentColor"/>
    </svg>
  }

  @case ('delivery') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5 17h8.5l2-6H9.2L8 8H5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 13h2.5l2 2.2V17H18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7" cy="18" r="1.7" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="17" cy="18" r="1.7" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 11H2.5M5 14H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  }

  @case ('star') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2 7.5 14 3 9.6l6.2-.9L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  }

  @case ('location') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.8"/>
    </svg>
  }

  @case ('clock') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  }

  @case ('flag') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 21V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M6 5h10.5l-1.8 3 1.8 3H6V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  }

  @case ('globe') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/>
      <path d="M3.8 12h16.4M12 3.5c2.2 2.3 3.2 5.1 3.2 8.5S14.2 18.2 12 20.5M12 3.5C9.8 5.8 8.8 8.6 8.8 12s1 6.2 3.2 8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  }

  @case ('arrowRight') {
    <svg [class]="classes()" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  }
}
