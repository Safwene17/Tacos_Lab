<header
  class="fixed left-0 right-0 top-0 z-50 border-b border-brand-gold/10 bg-black/55 shadow-[0_18px_60px_rgba(0,0,0,0.35)] backdrop-blur-xl"
>
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-3.5 sm:px-12 lg:px-24">
    <a href="#hero" class="group flex items-center gap-3" aria-label="Tacos Lab home">
      <img
        [src]="logoImage"
        alt="Tacos Lab logo"
        class="h-11 w-11 rounded-full object-cover ring-1 ring-brand-gold/35 shadow-[0_0_30px_rgba(255,210,48,0.16)] transition duration-300 group-hover:ring-brand-gold/70"
      />

      <div class="leading-none">
        <span class="block font-display text-3xl tracking-wide text-brand-white">
          Tacos Lab
        </span>

        <span class="hidden text-[10px] font-black uppercase tracking-[0.24em] text-brand-gold/80 sm:block">
          Authentic Mexican Cuisine
        </span>
      </div>
    </a>

    <div class="hidden items-center gap-7 lg:flex">
      @for (link of navLinks; track link.href) {
        <a
          [href]="link.href"
          class="group relative text-[13px] font-extrabold uppercase tracking-[0.16em] text-white/62 transition duration-300 hover:text-brand-yellow"
        >
          {{ link.label }}

          <span
            class="absolute -bottom-2 left-1/2 h-px w-0 -translate-x-1/2 bg-brand-gold transition-all duration-300 group-hover:w-full"
          ></span>
        </a>
      }
    </div>

    <div class="hidden items-center gap-3 lg:flex">
      <button
        type="button"
        disabled
        class="rounded-full bg-brand-gold px-5 py-3 text-[12px] font-black uppercase tracking-[0.16em] text-black shadow-[0_12px_35px_rgba(255,210,48,0.18)] transition duration-300 hover:-translate-y-0.5 hover:bg-brand-yellow hover:shadow-[0_16px_45px_rgba(255,210,48,0.30)] disabled:opacity-60 disabled:cursor-not-allowed"
      >
        Order Now
      </button>
    </div>

    <button
      type="button"
      class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-brand-gold/25 bg-black/25 text-brand-yellow shadow-[0_12px_35px_rgba(0,0,0,0.35)] backdrop-blur-md transition hover:border-brand-gold/70 hover:bg-brand-gold/10 lg:hidden"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
    >
      @if (menuOpen()) {
        ✕
      } @else {
        ☰
      }
    </button>
  </nav>

  @if (menuOpen()) {
    <div
      @slideDown
      class="border-t border-brand-gold/10 bg-black/90 px-6 py-6 shadow-[0_24px_70px_rgba(0,0,0,0.5)] backdrop-blur-xl lg:hidden"
    >
      <div class="flex flex-col gap-5">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            class="text-sm font-black uppercase tracking-[0.2em] text-white/72 transition hover:text-brand-yellow"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }

        <button
          type="button"
          disabled
          class="mt-2 rounded-full bg-brand-gold px-6 py-4 text-center text-sm font-black uppercase tracking-[0.16em] text-black shadow-[0_16px_45px_rgba(255,210,48,0.25)] disabled:opacity-60 disabled:cursor-not-allowed"
          (click)="closeMenu()"
        >
          Order Now
        </button>
      </div>
    </div>
  }
</header>
