<div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm dark:border-gray-800 dark:bg-white/[0.03] sm:p-6">
  <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
    Payroll Summary
  </h3>

  <p class="mt-1 text-theme-sm text-gray-500 dark:text-gray-400">
    Salary payments for the selected period.
  </p>

  <div class="mt-6 rounded-2xl bg-gray-50 p-5 dark:bg-white/[0.03]">
    <p class="text-theme-sm text-gray-500 dark:text-gray-400">
      Total Payroll
    </p>

    <p class="mt-2 text-title-sm font-bold text-gray-800 dark:text-white/90">
      {{ money(payroll()?.totalPayroll ?? 0) }}
    </p>
  </div>

  <div class="mt-5 grid grid-cols-2 gap-4">
    <div class="rounded-xl border border-gray-200 p-4 dark:border-gray-800">
      <p class="text-theme-xs text-gray-500 dark:text-gray-400">
        Payments
      </p>

      <p class="mt-2 text-lg font-semibold text-gray-800 dark:text-white/90">
        {{ payroll()?.payrollTransactionsCount ?? 0 }}
      </p>
    </div>

    <div class="rounded-xl border border-gray-200 p-4 dark:border-gray-800">
      <p class="text-theme-xs text-gray-500 dark:text-gray-400">
        Currency
      </p>

      <p class="mt-2 text-lg font-semibold text-gray-800 dark:text-white/90">
        RON
      </p>
    </div>
  </div>
</div>
