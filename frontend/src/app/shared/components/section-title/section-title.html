<div [class]="wrapperClasses()">
  <p class="mb-4 text-sm font-black uppercase tracking-[0.35em] text-brand-gold">
    Tacos Lab
  </p>

  <h2 class="font-display text-5xl leading-none text-brand-yellow drop-shadow-[0_10px_35px_rgba(0,0,0,0.45)] sm:text-6xl lg:text-7xl">
    {{ title() }}
  </h2>

  @if (subtitle()) {
    <p class="mt-5 text-base leading-8 text-white/65 sm:text-lg">
      {{ subtitle() }}
    </p>
  }
</div>
